<!DOCTYPE html>
<html lang="sv" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontakt - XPhone Recensioner</title>
  <meta name="description" content="Kontakta XPhone Recensioner för frågor, tips eller samarbeten.">

  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; line-height: 1.6; background-color: #ffffff; color: #111111; transition: background-color 0.3s, color 0.3s; }
    [data-theme="dark"] { background-color: #121212; color: #f0f0f0; }
    .container { max-width: 800px; margin: 0 auto; padding: 20px; }
    h1, h2 { margin-bottom: 10px; }
    p { margin-bottom: 1.2em; }
    input, textarea { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; }
    button.submit { padding: 10px 20px; background-color: #007bff; color: #fff; border: none; border-radius: 5px; cursor: pointer; }
    button.submit:hover { background-color: #0056b3; }
    #themeToggle { display: inline-block; padding: 10px 20px; margin: 20px 0; cursor: pointer; background-color: #007bff; color: #fff; border: none; border-radius: 5px; transition: background-color 0.3s; }
    #themeToggle:hover { background-color: #0056b3; }
    footer { text-align: center; padding: 20px; font-size: 0.9rem; color: #666; border-top: 1px solid #ddd; margin-top: 40px; }
    [data-theme="dark"] footer { border-top-color: #333; color: #aaa; }
    @media (max-width: 600px) { h2 { font-size: 1.5rem; } p, input, textarea, button { font-size: 0.95rem; } #themeToggle { width: 100%; } }
  </style>

  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6329597805915914" crossorigin="anonymous"></script>
</head>

<body>
  <div class="container">
    <h1>Kontakt</h1>
    <p>Har du frågor, tips eller vill samarbeta med oss? Fyll i formuläret nedan så återkommer vi så snart som möjligt.</p>

    <form action="#" method="post">
      <input type="text" name="name" placeholder="Ditt namn" required>
      <input type="email" name="email" placeholder="Din e-post" required>
      <textarea name="message" rows="6" placeholder="Ditt meddelande" required></textarea>
      <button type="submit" class="submit">Skicka</button>
    </form>

    <button id="themeToggle" aria-label="Byt mellan ljust och mörkt tema">🌙 Mörkt läge</button>

    <footer>
      <p>&copy; <span id="year"></span> XPhone Recensioner. 
        <a href="index.html">Hem</a> | 
        <a href="contact.html">Kontakt</a> | 
        <a href="privacy-policy.html">Integritetspolicy</a>
      </p>
    </footer>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const themeToggle = document.getElementById('themeToggle');
      const savedTheme = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
      themeToggle.textContent = savedTheme === 'dark' ? '☀️ Ljust läge' : '🌙 Mörkt läge';

      themeToggle.onclick = function() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        themeToggle.textContent = newTheme === 'dark' ? '☀️ Ljust läge' : '🌙 Mörkt läge';
      };

      document.getElementById('year').textContent = new Date().getFullYear();
    });
  </script>
</body>
</html>
